name: xsec-rank-band
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-xsec-rank.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/test_xsec.py -q
      - name: Pre-registered replication on disjoint assets (ranks 151-300), slippage 0.10%
        run: python tools/xsec.py --replication-before 2100-01-01 --skip-m 150 --top 450 --top-m 150 --slip 0.10 --days 3000 --out reports/xsec_rank 2>&1 | tee reports/xsec_rank.log
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b xsec-rank-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "xsec rank band" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin xsec-rank-results
