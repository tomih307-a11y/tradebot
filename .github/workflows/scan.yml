name: scan-v1
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-scan.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: (python3 alert_find.py Q_USDT 0.067381 19 0.068146 19:02:56 -15.3 -20.0; echo; echo =========; python3 alert_find.py AGT_USDT 0.05746 9 0.05751 09:02:48 -0.9 -5.7) 2>&1 | tee scan.txt | tail -70
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp scan.txt /tmp/out/ 2>/dev/null; gzip -c event_rows.json > /tmp/out/event_rows.json.gz 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b scan-results
          git config user.name "bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "scan" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin scan-results
