name: scan-v1
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-scan.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          git fetch origin track-results:tr && git show tr:tracker.json > tracker.json
          pip install -q numpy
          BASE=Min15 python3 feat_tracked.py 2>&1 | tail -5 && cp feat_tracked.json scan.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp scan.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b scan-results
          git config user.name "bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "scan" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin scan-results
