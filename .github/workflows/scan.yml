name: scan-now
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-scan.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan
        run: python tools/scan_now.py --out reports/scan --top 400 --fresh 4 2>&1 | tee reports/scan.log
        continue-on-error: true
      - name: Publish to branch scan-results
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b scan-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "scan $(date -u +%FT%TZ)" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin scan-results
