name: alert-log
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-alertlog.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alert-log
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pmo-zero-crossing-strategy-tzs5l3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch log branch
        run: |
          git clone -q --depth 1 --branch alert-log "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/alertlog 2>/dev/null || { mkdir /tmp/alertlog && cd /tmp/alertlog && git init -q && git checkout -q -b alert-log && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
      - name: Scan and resolve (read-only)
        run: python -m tradebot.strategies.mtf_entry.alert_log /tmp/alertlog
      - name: Publish
        run: |
          cd /tmp/alertlog && git config user.name "alert-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "alert log" || exit 0
          for i in 1 2 3; do git push -q origin alert-log && break; git pull -q --rebase origin alert-log || true; sleep 3; done
