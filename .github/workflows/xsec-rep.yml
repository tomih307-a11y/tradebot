name: xsec-replication
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-xsec-rep.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/test_xsec.py -q
      - name: Pre-registered replication on history before 2024-03-21 (H1 mom30, H2 mom7, H=7)
        run: python tools/xsec.py --replication-before 2024-03-21 --top 300 --top-m 150 --days 3000 --out reports/xsec_rep 2>&1 | tee reports/xsec_rep.log
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b xsec-rep-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "xsec replication" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin xsec-rep-results
