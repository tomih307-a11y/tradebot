name: watch
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-watch.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        run: |
          git fetch origin watch-results:wr 2>/dev/null && git show wr:watch.json > watch.json 2>/dev/null || rm -f watch.json
      - name: Watch
        run: python3 watch.py
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp watch.json watch.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b watch-results
          git config user.name "bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "watch" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin watch-results
