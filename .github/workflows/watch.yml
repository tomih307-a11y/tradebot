name: watch-levels
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-watch.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-levels
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore history branch
        run: |
          git clone -q --depth 1 --branch watch-results "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/watch_out 2>/dev/null || true
          cd /tmp/watch_out 2>/dev/null && git config user.name "watch-bot" && git config user.email "bot@example.com" || true
      - name: Watch levels (read-only)
        run: python tools/watch_levels.py '[{"sym":"TAO_USDT","trail":2.4,"stop0":195.43,"hh":198.61,"deadline":1795258810},{"sym":"BNB_USDT","trail":5.4,"stop0":588.987,"deadline":1795258810},{"sym":"IRYS_USDT","trail":0.0029,"stop0":0.0203,"hh":0.02358,"deadline":1795258810}]'
