name: watch-levels
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-watch.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-levels
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch levels (read-only)
        run: python tools/watch_levels.py '[{"sym":"VELVET_USDT","trail":0.0019,"stop0":0.0695,"deadline":1795262174}]'
