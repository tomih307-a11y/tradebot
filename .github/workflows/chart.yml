name: chart-multi
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-chart.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install matplotlib
      - name: Draw charts
        run: python3 chart_multi.py PHAROS_USDT:19:22:15 BEAT_USDT:19:22:15 AKE_USDT:19:20:15 ARIA_USDT:19:19:30
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp *.png charts.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b chart-results
          git config user.name "bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "charts" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin chart-results
