name: chart-multi
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-chart.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install matplotlib
      - name: Draw charts
        run: python3 chart_multi.py 1:IRYS_USDT:11-11:02:45 2:ETC_USDT:11-19:08:15 3:RIVER_USDT:11-17:15:00 4:XPL_USDT:11-10:13:15 5:SAND_USDT:10-28:12:15 6:SKY_USDT:10-18:08:15 7:WIF_USDT:10-02:04:45 8:LINK_USDT:10-20:17:45 9:DOGE_USDT:11-17:16:15 10:PEPE_USDT:11-18:03:00 11:CRV_USDT:10-28:23:45 12:XRP_USDT:10-02:06:00
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp *.png charts.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b chart-results
          git config user.name "bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "charts" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin chart-results
