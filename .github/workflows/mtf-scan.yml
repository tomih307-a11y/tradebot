name: mtf-scan
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-mtf-scan.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Live MTF scan (read-only, no orders)
        run: |
          mkdir -p reports/mtf_scan
          { python tools/level_status.py VELVET_USDT 1795088760 0.07143 0.0695 99999 long; echo; python tools/level_status.py BLESS_USDT 1795088760 0.011124 0.0108572 99999 long; echo; python tools/level_status.py BNB_USDT 1795088760 593.56 588.987 99999 long; echo; python tools/level_status.py TIA_USDT 1795088760 0.3553 0.349175 99999 long; echo; python tools/level_status.py IRYS_USDT 1795081800 0.0232 0.0203 99999 long; echo; python tools/level_status.py LUNC_USDT 1795081800 4.739e-05 4.37e-05 99999 long; } 2>&1 | tee reports/mtf_scan/status3.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/mtf_scan/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b mtf-scan-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "mtf scan" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin mtf-scan-results
