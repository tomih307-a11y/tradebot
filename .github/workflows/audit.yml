name: audit-pmo
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-audit.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore downloaded candles
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mexc-candles-audit-${{ github.run_id }}
          restore-keys: mexc-candles-
      - name: Independent audit (signal-only forward returns + engine accounting)
        run: python tools/audit.py --out reports/audit --sample 60 2>&1 | tee reports/audit.log
        continue-on-error: true
      - name: Publish to branch audit-results
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b audit-results
          git config user.name "audit-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "audit results" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin audit-results
