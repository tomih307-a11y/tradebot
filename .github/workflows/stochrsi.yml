name: stochrsi-study
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-stochrsi.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore downloaded candles
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mexc-candles-stochrsi-${{ github.run_id }}
          restore-keys: mexc-candles-
      - name: Tests (indicators)
        run: python -m pytest tests/test_stochrsi.py tests/test_indicators.py -q
      - name: StochRSI study
        run: python tools/stochrsi_study.py --out reports/stochrsi 2>&1 | tee reports/stochrsi.log
        continue-on-error: true
      - name: Publish to branch stochrsi-results
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b stochrsi-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "stochrsi study results" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin stochrsi-results
