name: reverse-study
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-reverse.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore downloaded candles
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mexc-candles-reverse-${{ github.run_id }}
          restore-keys: mexc-candles-
      - name: Reverse-signal study
        run: python tools/reverse_study.py --out reports/reverse 2>&1 | tee reports/reverse.log
        continue-on-error: true
      - name: Publish to branch reverse-results
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b reverse-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "reverse study results" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin reverse-results
