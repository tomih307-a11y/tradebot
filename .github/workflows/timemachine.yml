name: time-machine
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-timemachine.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        htf: [Min60, Hour4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore candles
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mexc-candles-tm-${{ matrix.htf }}-${{ github.run_id }}
          restore-keys: |
            mexc-candles-aligned-
            mexc-candles-rulesall-
      - name: Tests
        run: python -m pytest tests/test_timemachine.py -q
      - name: Whole market with PMO length 4
        run: python tools/timemachine.py --universe 5000 --roc-len 4 --htf ${{ matrix.htf }} --side both --out reports/tm_universe 2>&1 | tee reports/tm_universe_${{ matrix.htf }}.log
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b tm-universe-${{ matrix.htf }}-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "time machine (universe ${{ matrix.htf }})" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin tm-universe-${{ matrix.htf }}-results
