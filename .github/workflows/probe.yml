name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            curl -sS -m 30 -L https://docs.tardis.dev/faq/billing-and-subscriptions.md -o /tmp/b.md
            echo "=== how much historical data (section) ==="
            python3 - <<'PY'
          t = open("/tmp/b.md", encoding="utf-8").read()
          i = t.find("### How much historical data")
          print(t[i:i + 3500])
          j = t.find("### What is included in Perpetuals")
          print("=== perpetuals plan ===")
          print(t[j:j + 1500])
          import re
          print("=== price mentions ===")
          for m in re.finditer(r"[^\n]*(\$|USD|per month|/month|price|pricing)[^\n]*", t):
              print(m.group(0)[:300])
          PY
            echo "=== tardis.dev order form text ==="
            curl -sS -m 30 -L https://tardis.dev/ | python3 -c "import sys,re,html; t=sys.stdin.read(); t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S); t=re.sub(r'<[^>]+>','\n',t); t=html.unescape(t); lines=[l.strip() for l in t.split('\n') if l.strip()]; print('\n'.join(l for l in lines if re.search(r'\\$|USD|month|year|Solo|Academic|Professional|Business|Perpetuals|Derivatives', l))[:5000])"
          } 2>&1 | tee reports/probe/tardis.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
