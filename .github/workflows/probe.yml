name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            curl -sS -m 60 -L https://docs.tardis.dev/llms-full.txt -o /tmp/full.txt || true
            echo "size: $(wc -c < /tmp/full.txt)"
            python3 - <<'PY'
          import re
          t = open("/tmp/full.txt", encoding="utf-8", errors="ignore").read()
          seen = set()
          for m in re.finditer(r"[^\n]*(free trial|Free trial|trial)[^\n]*", t):
              line = m.group(0).strip()[:420]
              if line not in seen:
                  seen.add(line)
                  print("-", line)
              if len(seen) >= 40:
                  break
          i = t.find("agents-and-ai")
          j = t.find("# AI agents")
          print("=== agents page ===")
          print(t[j:j + 2500] if j >= 0 else "not found")
          PY
          } 2>&1 | tee reports/probe/tardis.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
