name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            UA="Mozilla/5.0"
            for sym in "%5EGSPC" "TSLA" "%5EVIX"; do
              echo "== yahoo $sym"; curl -sS -m 60 -L -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/$sym?range=1y&interval=1d" -o "reports/probe/y_$sym.json"; wc -c < "reports/probe/y_$sym.json"; head -c 200 "reports/probe/y_$sym.json"; echo
            done
            for q in _SPX TSLA _VIX; do echo "== cboe $q"; curl -sS -m 40 -L "https://cdn.cboe.com/api/global/delayed_quotes/quotes/$q.json" -o "reports/probe/q_$q.json"; head -c 700 "reports/probe/q_$q.json"; echo; done
            curl -sS -m 90 -L "https://cdn.cboe.com/api/global/delayed_quotes/options/TSLA.json" -o reports/probe/tsla_chain.json; ls -l reports/probe/tsla_chain.json
            curl -sS -m 90 -L "https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json" -o reports/probe/spx_chain.json
          } 2>&1 | tee reports/probe/mk.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
