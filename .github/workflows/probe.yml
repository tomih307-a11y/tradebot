name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            echo "== STOOQ SPX daily"; curl -sS -m 40 -L "https://stooq.com/q/d/l/?s=%5Espx&i=d" | tail -40
            echo "== STOOQ VIX daily"; curl -sS -m 40 -L "https://stooq.com/q/d/l/?s=%5Evix&i=d" | tail -8
            echo "== STOOQ ES futures"; curl -sS -m 40 -L "https://stooq.com/q/l/?s=es.f&f=sd2t2ohlcv&h&e=csv"
            echo "== CBOE SPX options"; curl -sS -m 90 -L "https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json" -o /tmp/spx.json; ls -l /tmp/spx.json; head -c 600 /tmp/spx.json
          } 2>&1 | tee reports/probe/spx.txt
          cp /tmp/spx.json reports/probe/spx_chain.json 2>/dev/null || true
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
