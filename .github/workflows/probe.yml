name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            for u in faq/billing-and-subscriptions.md faq/general.md faq/data.md api/rate-limits.md; do
              echo "=== docs.tardis.dev/$u ==="
              curl -sS -m 30 -L "https://docs.tardis.dev/$u" | head -c 7000
              echo
            done
            echo "=== tardis.dev pricing (links) ==="
            curl -sS -m 30 -L https://tardis.dev/pricing | grep -oiE '\$ ?[0-9][0-9,]*(\.[0-9]+)?[^<"]{0,60}|(free|trial|academic|solo|pro|business|per month|/month)[^<"]{0,60}' | sort -u | head -80
            echo "=== tardis.dev main ==="
            curl -sS -m 30 -L https://tardis.dev/ | grep -oiE '\$ ?[0-9][0-9,]*[^<"]{0,60}' | sort -u | head -30
          } 2>&1 | tee reports/probe/tardis.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
