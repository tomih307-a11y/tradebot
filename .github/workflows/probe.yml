name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            B=https://contract.mexc.com/api/v1/contract
            NOW=$(date +%s); DAY=$((NOW-14*86400)); MS=$((DAY*1000))
            for p in "deals/ICP_USDT?limit=1000" "deals/ICP_USDT?limit=100&start_time=$MS&end_time=$((MS+3600000))" "deals/ICP_USDT?limit=100&start=$DAY&end=$((DAY+3600))" \
                     "deals/ICP_USDT?limit=100&id=17000000000" "depth_commits/ICP_USDT/20" "kline/ICP_USDT?interval=Min1&start=$DAY&end=$((DAY+3600))" \
                     "ticker?symbol=ICP_USDT" "funding_rate/history?symbol=ICP_USDT&page_num=1&page_size=5" "open_interest/history?symbol=ICP_USDT" "openInterest?symbol=ICP_USDT" \
                     "kline/ICP_USDT?interval=Min15&start=$((NOW-900*5000))&end=$NOW" "kline/ICP_USDT?interval=Min1&start=$((NOW-60*5000))&end=$NOW"; do
              echo "--- $p"
              curl -sS -m 30 -w "\n[http %{http_code}]\n" "$B/$p" | head -c 450
            done
          } 2>&1 | tee reports/probe/tardis.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
