name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            echo "=== tardis exchange coverage mexc-futures ==="
            curl -sS -m 30 https://api.tardis.dev/v1/exchanges/mexc-futures | head -c 6000
            echo; echo "=== tardis pricing page (text) ==="
            curl -sS -m 30 -L https://tardis.dev/pricing | python3 -c "import sys,re,html; t=sys.stdin.read(); t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t)); print(t[:6000])"
          } 2>&1 | tee reports/probe/tardis.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
