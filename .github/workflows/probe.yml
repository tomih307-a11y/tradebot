name: mexc-probe
on:
  push:
    branches: [claude/pmo-zero-crossing-strategy-tzs5l3]
    paths: [".github/run-probe.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Probe
        run: |
          mkdir -p reports/probe
          {
            for u in "charts/historical/_SPX.json" "charts/historical/_VIX.json" "quotes/_VIX.json" "quotes/_SPX.json"; do echo "== $u"; curl -sS -m 60 -L "https://cdn.cboe.com/api/global/delayed_quotes/$u" -o /tmp/x.json; echo $(wc -c </tmp/x.json); head -c 400 /tmp/x.json; echo; cp /tmp/x.json "reports/probe/$(echo $u | tr / _)"; done
            echo "== FRED SP500"; curl -sS -m 40 -L "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500" | tail -30
            echo "== FRED VIX"; curl -sS -m 40 -L "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS" | tail -10
          } 2>&1 | tee reports/probe/spx2.txt
      - name: Publish
        if: always()
        run: |
          mkdir /tmp/out && cp -r reports/probe/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b probe-results
          git config user.name "study-bot" && git config user.email "bot@example.com"
          git add -A && git commit -q -m "probe" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin probe-results
