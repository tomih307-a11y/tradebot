# ═══════════════════════════════════════════════════════════════
# إعدادات tradebot — كل الأرقام هنا، ولا شيء ثابت داخل الكود.
# ═══════════════════════════════════════════════════════════════

[general]
strategy = "pmo_zero_cross"        # الاستراتيجية المختارة (انظر tradebot/strategies/__init__.py)
log_level = "INFO"

[mexc]
base_url = "https://contract.mexc.com"
api_key_env = "MEXC_API_KEY"       # أسماء متغيرات البيئة التي تحمل المفاتيح
api_secret_env = "MEXC_API_SECRET"
request_timeout_sec = 15
max_retries = 6
kline_page_limit = 2000            # أقصى عدد شموع في طلب واحد
min_request_interval_sec = 0.15    # فاصل بين الطلبات (حماية من حدّ معدل MEXC)

# ───────── إعدادات التداول المشتركة (تحترمها الاستراتيجية كما هي) ─────────
[trading]
dry_run = true                     # DRY_RUN: لا أوامر حقيقية عند true
trade_size_usdt = 20.0             # الهامش (margin) لكل صفقة بالـ USDT
max_open_trades = 5                # الحد الأقصى للصفقات المفتوحة
leverage = 5
margin_type = "isolated"           # isolated | cross
stop_loss_pct = 3.0                # وقف الخسارة الابتدائي كنسبة مئوية من سعر الدخول (على السعر وليس الهامش)
taker_fee_pct = 0.04               # رسوم Taker لكل جهة (دخول أو خروج) — تحقق منها من حسابك على MEXC
btc_symbol = "BTC_USDT"
symbols = ["BTC_USDT", "ETH_USDT", "SOL_USDT", "XRP_USDT", "DOGE_USDT", "BNB_USDT", "ADA_USDT", "AVAX_USDT"]

# ───────── استراتيجية: تسلسل عبور الصفر لـ PMO ─────────
[pmo_zero_cross]
tf_entry = "Min15"
tf_1h = "Min60"
tf_4h = "Hour4"

[pmo_zero_cross.indicator]
roc_smooth_len = 35                # csf(roc, 35)
roc_scale = 10                     # 10 × csf(roc,35)
pmo_smooth_len = 20                # csf(..., 20)
signal_len = 10                    # EMA(PMO, 10)
warmup_bars = 300                  # تجاهل أول N شمعة من كل فريم
atr_len = 14

[pmo_zero_cross.exits]             # مفاتيح تشغيل/إيقاف شروط الفشل
fail_1h_slope = true               # WAIT_1H: شمعة ساعة مغلقة بـ SLOPE_1H < 0
fail_1h_pmo15_back = true          # WAIT_1H: PMO_15 يعود تحت الصفر
fail_1h_timeout = true             # WAIT_1H: تجاوز المهلة الديناميكية WAIT_DEADLINE دون عبور
# WAIT_DEADLINE = رقم الشمعة الحالية + min( max_wait_1h_cap , max( min_wait_1h , ceil( ETA_1H × 4 × wait_eta_mult ) ) )
# تُحسب عند الدخول وتُعاد عند إغلاق كل شمعة ساعة؛ ETA لا نهائي => min_wait_1h.
min_wait_1h = 16                   # شموع 15 دقيقة
wait_eta_mult = 1.5
max_wait_1h_cap = 96               # 24 ساعة
fail_4h_slope = true               # WAIT_4H: شمعة 4س مغلقة بـ SLOPE_4H < 0
fail_4h_pmo1h_back = true          # WAIT_4H: PMO_1H يعود تحت الصفر

[pmo_zero_cross.trail]
mult_1 = 3.0                       # بعد عبور الساعة:      ATR_15 × mult_1
mult_2 = 1.5                       # بعد عبور الـ4 ساعات:  ATR_1H × mult_2
mult_3 = 1.5                       # ضعف زخم داخل RIDE:    ATR_15 × mult_3
# نقطة التعادل لا تُطبَّق إلا إذا كان السعر الحالي تجاوزها (وإلا تقع فوق السعر في اللونق وتُضرب في الشمعة التالية).
# false = التطبيق الحرفي دائماً.
breakeven_requires_protective = true

[pmo_zero_cross.filters]           # كلها مطفأة افتراضياً
filter_1h_slope = false
filter_1h_signal = false
filter_eta_max = false
eta_max_value = 4.0                # بعدد شموع الساعة (يُستخدم فقط إذا filter_eta_max = true)
filter_4h_slope = false
filter_btc = false

[pmo_zero_cross.backtest]
# MEXC تحتفظ بشموع 15 دقيقة لنحو 6 أشهر فقط (الساعة و4 ساعات أطول). اختر فترة ضمن آخر ~170 يوماً.
start = "2026-04-20T00:00:00Z"
end = "2026-10-11T00:00:00Z"
# symbols = [...]                  # اختياري: يتجاوز trading.symbols في الباكتست فقط؛ أو "all" = كل عقود USDT النشطة على MEXC
slippage_pct = 0.02
slippage_on_stop = false           # الوقف يُنفَّذ بسعره (أو بالافتتاح عند الفجوة) دون انزلاق
funding_interval_hours = 8
funding_fixed_pct = 0.01           # يُستخدم عند غياب بيانات MEXC التاريخية (% لكل فترة تمويل)
use_mexc_funding_history = true
funding_history_max_symbols = 20   # عند عدد عملات أكبر يُستخدم التمويل الثابت (جلب التاريخ لكل عملة بطيء)
progress_every = 50                # طباعة التقدم كل N عملة أثناء التنزيل
report_max_symbols_listed = 20     # لا يُطبع أكثر من هذا العدد من أسماء العملات في التقرير
split_selection_pct = 70           # 70% اختيار / 30% تحقق (حسب الزمن)
min_sample = 30                    # أقل من هذا = "عينة غير كافية"
eta_buckets = [0, 2, 4, 8]         # شرائح ETA_1H: 0–2، 2–4، 4–8، 8+، ثم لا نهائي
sweep_mult_1 = [2.0, 2.5, 3.0, 4.0]
sweep_mult_2 = [1.0, 1.5, 2.0, 3.0]
sweep_mult_3 = [1.0, 1.5, 2.0]
sweep_wait_eta_mult = [1.0, 1.5, 2.0]   # + وضع «بدون مهلة» (الخروج بالميل فقط)
liquidity_window_bars = 96         # سيولة 24 ساعة = مجموع قيمة التداول لآخر 96 شمعة 15د
data_dir = "data/cache"
reports_dir = "reports"

[pmo_zero_cross.live]
close_margin_sec = 5               # هامش ثوانٍ بعد إغلاق الشمعة لضمان اكتمالها
history_bars = 700                 # عدد الشموع المجلوبة لكل فريم في كل دورة
state_file = "state/pmo_zero_cross_state.json"
cells_file = "reports/last_backtest_cells.json"   # نسب العبور التاريخية للتنبيهات
min_quote_volume_24h = 0           # تجاهل عملات سيولتها أقل من هذا (0 = معطل)
telegram_token_env = "TELEGRAM_BOT_TOKEN"
telegram_chat_id_env = "TELEGRAM_CHAT_ID"

# ───────── أبحاث جانبية (لا تؤثر على الاستراتيجية) ─────────
[research.stochrsi]
rsi_len = 14                       # إعدادات TradingView الافتراضية لـ Stochastic RSI
stoch_len = 14
smooth_k = 3
smooth_d = 3
oversold = 20
overbought = 80

# ───────── استراتيجية: توصيات قناة Telegram العامة (وحدة مستقلة) ─────────
# التشغيل: python -m tradebot --strategy telegram_signals live      (dry_run في [trading] يتحكم: true = ورقي)
[telegram_signals]
channel = "-1002639765041"          # قناة عامة: اسمها بعد t.me/ — قناة خاصة: رقمها (يُقرأ بحسابك عبر Telethon)
poll_interval_sec = 5              # كل كم ثانية يفحص القناة والصفقات
max_signal_age_sec = 900           # يتجاهل توصية أقدم من هذا (عند إعادة التشغيل مثلاً)
max_entry_deviation_pct = 1.0      # يتجاهل التوصية إذا ابتعد السعر الحالي عن الدخول بأكثر من هذا (التوصية فاتت)
margin_pct_of_balance = 10         # حد 1: هامش كل صفقة = هذه النسبة من الرصيد
max_concurrent = 2                 # حد 2: أقصى صفقات متزامنة
paper_balance_usdt = 25            # الرصيد الابتدائي في الوضع الورقي
leverage_mode = "signal"           # signal = رافعة التوصية (مقيّدة بحد المنصة للعقد) | fixed
fixed_leverage = 5
stop_mode = "channel_4h_close"     # channel_4h_close = قاعدة القناة (إغلاق شمعة 4س) | exchange = أمر وقف حقيقي
breakeven_after_tp1 = true         # بعد الهدف الأول ينتقل الوقف لسعر الدخول (كما تفعل القناة)
maintenance_margin = 0.005         # لحساب سعر التصفية في المحاكاة
paper_fee_pct = 0.04               # رسوم كل تنفيذ في المحاكاة (محافظ: Taker)
paper_slippage_pct = 0.02
state_file = "state/telegram_signals_state.json"
log_file = "reports/telegram_signals_trades.csv"

# ───────── multi_agent: خمسة وكلاء مترابطين (python -m tradebot --strategy multi_agent live) ─────────
# يستخدم حدود [telegram_signals] نفسها (هامش %، صفقات متزامنة) و dry_run في [trading].
[agents]
scan_interval_sec = 120            # كل كم ثانية يعيد الماسح والمحلل العمل (قصير ليلتقط إغلاق شمعة 15د بسرعة)
analyst = "rules"                # rules = شروطك أنت ([agents.rules]) | smc = وكيل SMC الآلي | technical = المؤشرات الكلاسيكية
own_analysis = true                # false = لا تحليل ذاتي، فقط توصيات القناة تمر عبر الوكلاء
max_pending = 5                    # أقصى توصيات تنتظر نقطة دخول
cooldown_sec = 3600                # لا إعادة تحليل/دخول نفس العملة قبل هذه المدة

[agents.scanner]
top_n = 15
min_turnover_usdt = 5000000        # سيولة 24س الدنيا
w_move = 1.0                       # وزن حركة السعر 24س (%)
w_liquidity = 2.0                  # وزن لوغاريتم السيولة

[agents.technical]
min_bars = 120
ema_fast = 20
ema_slow = 50
atr_len = 14
rsi_len = 14
rsi_lo = 40                        # long: RSI بين lo و hi (short: المرآة)
rsi_hi = 65
pullback_atr = 1.0                 # أقصى بعد عن EMA السريع (بوحدات ATR) لاعتباره ارتداداً
zone_atr = 0.3                     # نصف عرض منطقة الدخول حول EMA السريع
stop_atr = 2.0
tp_atr = [1.0, 2.0, 3.0]
min_score = 0.8                    # الحد الأدنى من شروط التحليل المتحققة (من 5)

[agents.news]
feeds = ["https://www.coindesk.com/arc/outboundfeeds/rss/", "https://cointelegraph.com/rss"]
per_feed = 30
ttl_sec = 600
max_headlines = 8
veto_bias = 0.5                    # يرفض الدخول إذا الأخبار ضد الاتجاه بهذا القدر
weight = 0.2                       # وزن الأخبار في درجة التوصية
use_claude = false                 # true = يقيّم العناوين بـ Claude (يحتاج ANTHROPIC_API_KEY)
claude_model = "claude-haiku-5-5"

[agents.entry]
confirm_candles = 2                # شموع دقيقة مغلقة متتالية مع الاتجاه
max_chase_atr = 0.5                # لا يطارد سعراً ركض أبعد من هذا عن المنطقة
expire_sec = 7200                  # صلاحية التوصية المنتظرة

[agents.exit]
trail_atr = 1.5                    # وقف متحرك بعد الهدف الأول
max_hold_sec = 86400               # مدة قصوى لصفقة غير رابحة
news_tighten_bias = 0.3            # خبر عكسي: الوقف إلى سعر الدخول إذا رابحة
news_close_bias = 0.7              # خبر عكسي قوي: إغلاق
open_trail_atr = 2.0               # صفقة بهدف مفتوح: الوقف يلحق السعر بهذه المسافة (ATR ساعة)
open_trail_activation_r = 1.0      # يبدأ الوقف المتحرك بعد ربح بقدر هذا المضاعف من المخاطرة الأولية
target_rr = 1.0                    # عائد/مخاطرة متوسط الأهداف الذي يعطي تصويتاً كاملاً
min_rr = 0.5                       # أقل من هذا: وكيل الخروج يرفض التوصية (فيتو)

[agents.channel]                   # (اختياري) توصيات القناة عبر الوكلاء — معطّل: الوكلاء يعملون مستقلين
enabled = false                    # يقرأ [telegram_signals] channel
refine_entry = true                # وكيل الدخول يحسّن نقطة الدخول بدل الدخول الفوري
zone_pct = 0.3                     # نصف عرض منطقة الدخول حول سعر التوصية (%)
expire_sec = 900                   # إن لم يتحقق دخول مناسب خلال هذه المدة تُلغى التوصية
news_veto = true                   # وكيل الأخبار يستطيع رفض توصية القناة
manage_exit = true                 # وكيل الخروج يدير صفقاتها (وقف متحرك بعد الهدف1، خبر عكسي) دون تغيير الأهداف

[agents.consensus]                 # تعاون الوكلاء: كل وكيل يصوّت 0..1، ويمكنه الفيتو
weights = { scanner = 0.5, rules = 2.5, smc = 2.5, technical = 1.0, news = 1.0, exit = 1.0 }
min_confidence = 0.65              # لا تُنشر توصية بثقة أقل
ledger_file = "reports/agents_ledger.csv"   # كل توصية منشورة + تصويت كل وكيل + نتيجتها (لمعرفة أي وكيل يصيب)

[agents.execution]                 # الوكيل السادس: التداول الآلي
enabled = true                     # false = نشر التوصيات فقط بدون أي صفقة

[agents.smc]                       # تحليل Smart Money (إغلاقات الشموع فقط، بلا نظر للمستقبل)
swing_len = 3                      # شموع على كل جانب لتأكيد قمة/قاع (فراكتل)
min_bars = 120
atr_len = 14
event_max_age = 40                 # أقصى عمر (بالشموع) لآخر BOS/CHoCH ليُعتد به
max_dist_atr = 3.0                 # أقصى بعد للسعر عن منطقة الدخول (ATR) لنشر التوصية
sweep_lookback = 20
require_htf = true                 # اتجاه 4س يجب أن يوافق هيكل الساعة
min_score = 0.5                    # حد أدنى من 6 شروط
stop_buffer_atr = 0.3              # الوقف خلف طرف المنطقة بهذه المسافة
tp_r = [1.0, 2.0, 3.0]             # الأهداف كمضاعفات للمخاطرة
unconfirmed_vote = 0.4             # تصويت المؤشرات الكلاسيكية حين لا تؤكد

[agents.rules]                     # شروطك: لا تُنشر توصية إلا إذا تحققت كلها
conditions = ["price_in_ob_4h", "pmo15_zero_touch"]   # 1) السعر داخل أوردر بلوك 4س  2) فريم الدخول 15د: PMO عبر الصفر ثم لمسه (أضف شروطاً هنا لاحقاً)
swing_len = 3                      # شموع 4س على كل جانب لتأكيد القمة/القاع
min_bars = 60
max_age_bars = 200                 # أقصى عمر للـOB بشموع 4س (200 ≈ 33 يوماً)
ob_method = "extreme"              # extreme = شمعة أعلى قمة/أدنى قاع في الموجة (كما LuxAlgo) | last_opposite = آخر شمعة معاكسة
mitigation = "wick"                # wick = ذيل خلف الطرف البعيد يُسقطها | close = إغلاق خلفه | none
atr_len = 14
stop_buffer_atr = 0.3              # الوقف خلف الطرف البعيد للـOB بهذه المسافة (ATR 4س)
tp_r = [1.0, 2.0, 3.0]
# شرط 2: فريم الدخول 15د — PMO قطع خط الإشارة (للأعلى للشراء) ثم أول لمسة لخط الصفر = توصية فورية
bars_15m = 700                     # شموع 15د المُحمَّلة (الإحماء 300 + مساحة للبحث)
min_bars_15m = 400
pmo_cross_max_age_bars = 96        # أقصى عمر لتقاطع PMO مع الإشارة قبل اللمس (96 شمعة 15د = 24 ساعة)
pmo_touch_window_bars = 1          # لمس الصفر يجب أن يكون في آخر N شمعة 15د مغلقة (1 = الشمعة الأخيرة، أي فوراً)
entry_tf_trigger = true            # true = إشارة 15د هي الدخول، بدون تأكيد شموع الدقيقة
open_target = true                 # true = بلا أهداف ثابتة، وقف متحرك فقط ([agents.exit] open_trail_*) | false = tp_r
